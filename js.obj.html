<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js内部对象</title>
</head>
<body>
    <script>
        //math对象
        console.log(Math.floor(3.9));//向下取整
        console.log(Math.ceil(3.1));//向上取整
        console.log(Math.round(15.9));//四舍五入
        console.log(Math.random());//随机数[0,1)
        function getRandom(min,max){
            return Math.floor(Math.random()*(max-min+1)+min);
        }
        console.log(getRandom(100,900));//获取100-900之间的随机数
        //date对象
        var date = new Date();
        console.log(date.getFullYear());//获取年份
        console.log(date.getMonth()+1);//获取月份(1-12)
        console.log(date.getDate());//获取日期(1-31)
        console.log(date.getDay());//获取星期(0-6)
        console.log(date.getHours());//获取小时(0-23)
        console.log(date.getMinutes());//获取分钟(0-59)
        console.log(date.getSeconds());//获取秒数(0-59)
        console.log(date.getHours()+":"+date.getMinutes()+":"+date.getSeconds());//获取时间
        console.log(date.getTime());//获取时间戳(毫秒数)
        //数组对象
        var arr = [1,2,3,4,5,'a','b','c'];
        var arr1 = new Array(1,2,3,4,5,'a','b','c');
        console.log(arr);
        console.log(arr1);
        console.log(new Array(5));//创建一个长度为5的数组
        console.log(arr.length);//获取数组长度
    </script>  
</body>
</html>
