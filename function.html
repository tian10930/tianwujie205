<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS函数</title>
</head>
<body>
    <!--写一个随机数游戏，计算机随机给出一个范围的随机数，学生输入猜测数字，计算机给出数字大了或小了，直到学生猜中或达到指定次数-->
    <button onclick="guessNumber()">猜猜我是几？</button>
    <script>
        function guessNumber() {
            let num=getRandomNumber(1,25);
            let count=0;
            while(count<5){
                let input=prompt("请输入你猜的数字：");
                if(input === null) {
                    alert("游戏结束！");
                    return;
                }
                input = parseInt(input);
                if(isNaN(input) ){
                    alert("请输入一个有效的数字！");
                    continue;
                
                }
                if(input>num){
                    alert("你猜的数字大了！");  
            }
            else if(input<num){
                    alert("你猜的数字小了！");
                }
                else{
                    alert("恭喜你，猜对了！");
                    return;
                }
                count++;
            }
            alert("很遗憾，你没有猜中，正确的数字是：" + num);
        }
        var getRandomNumber = (min, max) => {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>                 
</body>
</html>
