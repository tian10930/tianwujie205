<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!--类 实例就是对象，两个要素，属性和方法
    学生的属性：学号，姓名，性别，班级等
    方法：学习，考试等-->
</head>
<body>
    <script>
        // 对象的创建方式
        // 1.对象字面量
        var student = {
            name:"张三",
            age:20,
            sex:"男",
            class:"一班",
            hobby:["唱歌","跳舞","打篮球"],
            study:function(){
                console.log("学习");
            },
            exam:function(){
                console.log("考试");
            }
        }
        console.log(student.name);
        console.log(student.hobby[1]);
        //删除对象方法
        delete student.exam;
        //判断对象中是否有某个属性或方法
        console.log('exam' in student);
        //对象的遍历
        for(var key in student){
            console.log(key,student[key]);
        }
        //对象的赋值其实是复制了引用的地址，相当于起别名，多个变量可以指向同一个对象
        var o=student;
        console.log(o.name);
        o.name='李四'
        //对象的引用类型（引用的是地址）
        console.log('o的名字'+o.name);
        console.log('student的名字'+student.name);
    </script>    
        
</body>
</html>
