<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg图标</title>
    <script src="https://at.alicdn.com/t/c/font_5231923_n1ed3fwhgvk.js"></script>
    <link rel="stylesheet" href="./css/svg.css">
</head>
<body>
    <h3>svg图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
               <use xlink:href="#icon-baocun"></use>
            </svg>
                <span>保存</span>
                <!-- div.budge-dot回车 -->
                 <!-- 红点 -->
            <div class="budge-dot" id="budge-home"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
               <use xlink:href="#icon-sousuo"></use>
            </svg>
                <span>搜索</span>
                <!-- 数字红点 -->
            <div class="budge-num" id="budge-plan">5</div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
               <use xlink:href="#icon-dizhi"></use>
            </svg>
                <span>地址</span>
            <div class="budge-border" id="budge-collect"></div>
        </div>        
        <div class="tab-item"  onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
               <use xlink:href="#icon-quanxuan"></use>
            </svg>
                <span>全选</span>
            <div class="budge-num max" id="budge-all">100+</div>
        </div>                
    </div>
    <script>
        function changeTab(current){
        let tabs = document.querySelectorAll('.tab-item');
        for(let i = 0; i < tabs.length; i++){
            tabs[i].classList.remove('active');
        }
        current.classList.add('active');}
    </script>
</body>
</html>
